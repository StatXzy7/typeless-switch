name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_release:
        description: Build installer and portable release candidate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\TypelessSwitch.sln

      - name: Build
        run: dotnet build .\TypelessSwitch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\TypelessSwitch.sln --configuration Release --no-build

      - name: Set up installer compiler
        if: github.event_name == 'workflow_dispatch' && inputs.package_release
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }

      - name: Package release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.package_release
        shell: pwsh
        run: |
          dotnet publish .\src\TypelessSwitch.App\TypelessSwitch.App.csproj --configuration Release --runtime win-x64 --self-contained true --property:PublishProfile=win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer\TypelessSwitch.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          [xml]$project = Get-Content .\src\TypelessSwitch.App\TypelessSwitch.App.csproj -Encoding UTF8
          $releaseVersion = $project.Project.PropertyGroup.Version
          $portablePath = ".\installer\output\TypelessSwitch-$releaseVersion-win-x64-portable.zip"
          Compress-Archive -Path .\artifacts\publish\win-x64\* -DestinationPath $portablePath
          Copy-Item -LiteralPath '.\docs\使用说明.md' -Destination '.\installer\output\使用说明.md'
          Get-ChildItem .\installer\output -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object {
            $assetHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            [IO.File]::WriteAllText($_.FullName + '.sha256', "$assetHash  $($_.Name)", [Text.UTF8Encoding]::new($false))
          }

      - name: Verify installer startup and uninstall
        if: github.event_name == 'workflow_dispatch' && inputs.package_release
        shell: pwsh
        run: |
          $smokeRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $smokeDirectory = [IO.Path]::GetFullPath((Join-Path $smokeRoot 'typeless-switch-installer-smoke'))
          if (-not $smokeDirectory.StartsWith($smokeRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Unsafe installer test directory.'
          }
          $installers = @(Get-ChildItem .\installer\output\*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one installer candidate.' }
          $installer = $installers[0]
          $installArguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', ('/DIR="' + $smokeDirectory + '"'))
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList $installArguments -WindowStyle Hidden -PassThru -Wait
          if ($installProcess.ExitCode -ne 0) { throw 'Installer test failed.' }
          $smokeProcess = $null
          try {
            $smokeExe = Join-Path $smokeDirectory 'TypelessSwitch.exe'
            if (-not (Test-Path -LiteralPath (Join-Path $smokeDirectory '使用说明.md'))) { throw 'Installed guide missing.' }
            $smokeProcess = Start-Process -FilePath $smokeExe -WindowStyle Normal -PassThru
            $smokeProcess.WaitForInputIdle(15000) | Out-Null
            Start-Sleep -Seconds 3
            $smokeProcess.Refresh()
            if ($smokeProcess.HasExited -or $smokeProcess.MainWindowHandle -eq 0 -or -not $smokeProcess.Responding) {
              throw 'Installed app main window did not open.'
            }
            $smokeProcess.CloseMainWindow() | Out-Null
            if (-not $smokeProcess.WaitForExit(10000)) { throw 'Installed app did not exit.' }
          } finally {
            if ($smokeProcess -and -not $smokeProcess.HasExited) {
              $smokeProcess.Kill()
              $smokeProcess.WaitForExit()
            }
            $uninstaller = Join-Path $smokeDirectory 'unins000.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -PassThru -Wait
              if ($uninstallProcess.ExitCode -ne 0) { throw 'Uninstall test failed.' }
            }
          }
          if (Test-Path -LiteralPath (Join-Path $smokeDirectory 'TypelessSwitch.exe')) { throw 'Installed app remained after uninstall.' }

      - name: Upload release candidate
        if: github.event_name == 'workflow_dispatch' && inputs.package_release
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: installer/output/*
          if-no-files-found: error
