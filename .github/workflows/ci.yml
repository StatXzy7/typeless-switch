name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\TypelessSwitch.sln

      - name: Build
        run: dotnet build .\TypelessSwitch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\TypelessSwitch.sln --configuration Release --no-build
